# Netlify Access Control for Development Environment
# This file can be used to password-protect the development site

# Password protection for development environments
# Uncomment and configure in Netlify dashboard under Site settings > Visitor access

# Basic Authentication Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Development-Notice = "This is a development environment - not for public access"
  conditions = {Context = ["develop", "deploy-preview", "branch-deploy"]}

# Optional: Force HTTPS redirect for development
[[redirects]]
  from = "http://myportfolio-develop.netlify.app/*"
  to = "https://myportfolio-develop.netlify.app/:splat"
  status = 301
  force = true
  conditions = {Context = ["develop"]}

# Optional: Maintenance mode for development
# [[redirects]]
#   from = "/*"
#   to = "/maintenance.html"
#   status = 200
#   conditions = {Context = ["develop"]}
#   headers = {X-From = "Netlify"}

# Instructions for password protection:
# 1. Go to Netlify Dashboard > Site Settings > Visitor access
# 2. Enable "Password protection" 
# 3. Set password for non-production environments
# 4. This will require authentication before accessing the site