# =============================================================================
# NETLIFYCMS CONFIGURATION - PORTFOLIO CONTENT MANAGEMENT
# =============================================================================
# File: static/admin/config.yml
# Purpose: NetlifyCMS configuration for content management across environments
# Environment Support: Development (localhost) & Production (Netlify)
# Backend: Git Gateway with Netlify Identity for authentication
# =============================================================================

# BACKEND CONFIGURATION
# Uses Git Gateway for production. local_backend: true auto-switches to the
# proxy server (netlify-cms-proxy-server on :8081) when accessed from localhost.
# No manual file swapping needed — run: npm run cms:local  to start the proxy.
backend:
  name: git-gateway
  branch: master # Change to 'main' if your default branch is 'main'

# LOCAL DEVELOPMENT BACKEND
# Automatically activates when site is accessed from localhost.
# Requires: npx netlify-cms-proxy-server (or npm run cms:local)
local_backend: true

# MEDIA STORAGE CONFIGURATION
# Uses Netlify Large Media for optimized image handling
media_folder: 'static/images/uploads'
public_folder: '/images/uploads'

# SITE URL (environment-specific)
# Production: https://isaiahdavis.com
# Development: http://localhost:1313
site_url: https://isaiahdavis.com
display_url: https://isaiahdavis.com

# EDITORIAL WORKFLOW (enables draft/review/publish workflow)
publish_mode: editorial_workflow

# =============================================================================
# COLLECTIONS CONFIGURATION
# =============================================================================
# Collections are ordered by update frequency.
# Blog Posts is first — it loads as the default CMS landing screen.

collections:
  # ---------------------------------------------------------------------------
  # BLOG POSTS  ← primary content area
  # ---------------------------------------------------------------------------
  - name: 'posts'
    label: 'Blog Posts'
    label_singular: 'Blog Post'
    folder: 'content/posts'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: '/posts/{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: ['date', 'title', 'draft']
    view_filters:
      - label: 'Drafts'
        field: draft
        pattern: true
      - label: 'Published'
        field: draft
        pattern: false
    fields:
      # Writing essentials — shown at the top of the editor
      - { label: 'Title', name: 'title', widget: 'string' }
      - {
          label: 'Description',
          name: 'description',
          widget: 'text',
          hint: 'Shown in cards, search results, and social previews'
        }
      - { label: 'Body', name: 'body', widget: 'markdown' }

      # Metadata
      - { label: 'Date Published', name: 'date', widget: 'datetime' }
      - { label: 'Last Modified', name: 'lastmod', widget: 'datetime', required: false }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: true }
      - {
          label: 'Author',
          name: 'author',
          widget: 'string',
          default: 'Isaiah Davis',
          required: false
        }

      # Taxonomy — governed vocabulary
      - label: 'Categories'
        name: 'categories'
        widget: 'select'
        multiple: true
        required: false
        options:
          - { label: 'Engineering', value: 'engineering' }
          - { label: 'Design', value: 'design' }
          - { label: 'Process', value: 'process' }
          - { label: 'Career', value: 'career' }
        hint: 'High-level content area. Pick one or two.'
      - label: 'Tags'
        name: 'tags'
        widget: 'relation'
        collection: 'tags_registry'
        search_fields: ['title', 'category', 'description']
        value_field: 'title'
        display_fields: ['title']
        multiple: true
        required: false
        hint: 'Select from the governed tag vocabulary. To add new tags, manage the Tag Registry collection.'
      - {
          label: 'Series',
          name: 'series',
          widget: 'string',
          required: false,
          hint: 'Group related posts under a series name'
        }

      # Media
      - { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false }
      - {
          label: 'Social Image',
          name: 'social_image',
          widget: 'image',
          required: false,
          hint: 'Falls back to featured image if omitted'
        }

      # SEO
      - { label: 'SEO Keywords', name: 'keywords', widget: 'list', required: false }

  # ---------------------------------------------------------------------------
  # PORTFOLIO PROJECTS
  # ---------------------------------------------------------------------------
  - name: 'portfolio'
    label: 'Portfolio Projects'
    label_singular: 'Project'
    folder: 'content/portfolio'
    create: true
    slug: '{{slug}}'
    preview_path: '/portfolio/{{slug}}'
    summary: '{{title}} — {{year}}'
    sortable_fields: ['title', 'weight', 'date']
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description', name: 'description', widget: 'text' }
      - { label: 'Body', name: 'body', widget: 'markdown' }

      - { label: 'Date', name: 'date', widget: 'datetime' }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - {
          label: 'Weight',
          name: 'weight',
          widget: 'number',
          default: 1,
          hint: 'Lower = displayed first'
        }

      - { label: 'Client', name: 'client', widget: 'string', required: false }
      - { label: 'Project URL', name: 'project_url', widget: 'string', required: false }
      - { label: 'Year', name: 'year', widget: 'string' }

      - { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false }
      - label: 'Gallery Images'
        name: 'gallery_images'
        widget: 'list'
        required: false
        fields:
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'Alt Text', name: 'alt', widget: 'string' }
          - { label: 'Caption', name: 'caption', widget: 'string', required: false }

      - label: 'Detail Page Images'
        name: 'detail_images'
        widget: 'list'
        required: false
        hint: 'Images rendered on portfolio detail pages. Each image supports layout variants and crop offsets.'
        summary: '{{fields.variant}} — {{fields.caption}}'
        fields:
          - { label: 'Image', name: 'image', widget: 'image', required: true }
          - { label: 'Alt Text', name: 'alt', widget: 'string', required: false }
          - { label: 'Caption', name: 'caption', widget: 'string', required: false }
          - label: 'Variant'
            name: 'variant'
            widget: 'select'
            default: 'standard'
            options:
              - { label: 'Standard (2-up)', value: 'standard' }
              - { label: 'Wide (full width)', value: 'wide' }
              - { label: 'Portrait', value: 'portrait' }
              - { label: 'Square', value: 'square' }
              - { label: 'Tall (narrow)', value: 'tall' }
              - { label: 'Hero strip (full width)', value: 'hero' }
          - label: 'Fit Mode'
            name: 'fit'
            widget: 'select'
            default: 'cover'
            options:
              - { label: 'Cover (crop to frame)', value: 'cover' }
              - { label: 'Contain (fit fully)', value: 'contain' }
          - label: 'Offset Preset'
            name: 'offset_preset'
            widget: 'select'
            default: 'custom'
            hint: 'Choose a quick focal-point preset, or custom to use manual X/Y sliders.'
            options:
              - { label: 'Custom', value: 'custom' }
              - { label: 'Center', value: 'center' }
              - { label: 'Top', value: 'top' }
              - { label: 'Bottom', value: 'bottom' }
              - { label: 'Left', value: 'left' }
              - { label: 'Right', value: 'right' }
              - { label: 'Top Left', value: 'top-left' }
              - { label: 'Top Right', value: 'top-right' }
              - { label: 'Bottom Left', value: 'bottom-left' }
              - { label: 'Bottom Right', value: 'bottom-right' }
          - {
              label: 'Offset X (%)',
              name: 'offset_x',
              widget: 'number',
              required: false,
              value_type: 'int',
              min: 0,
              max: 100,
              step: 1,
              default: 50,
              hint: 'Only used when Offset Preset = Custom.'
            }
          - {
              label: 'Offset Y (%)',
              name: 'offset_y',
              widget: 'number',
              required: false,
              value_type: 'int',
              min: 0,
              max: 100,
              step: 1,
              default: 50,
              hint: 'Only used when Offset Preset = Custom.'
            }

      - label: 'Categories'
        name: 'categories'
        widget: 'select'
        multiple: true
        required: false
        options:
          - { label: 'Branding', value: 'branding' }
          - { label: 'Web Design', value: 'web-design' }
          - { label: 'Editorial', value: 'editorial' }
          - { label: 'UX / Product', value: 'ux' }
        hint: 'Project discipline area.'
      - label: 'Tags'
        name: 'tags'
        widget: 'relation'
        collection: 'tags_registry'
        search_fields: ['title', 'category', 'description']
        value_field: 'title'
        display_fields: ['title']
        multiple: true
        required: false
        hint: 'Select from the governed tag vocabulary. To add new tags, manage the Tag Registry collection.'
      - {
          label: 'Technologies',
          name: 'technologies',
          widget: 'list',
          default: [],
          required: false
        }

  # ---------------------------------------------------------------------------
  # TAG REGISTRY  ← governed tag vocabulary (used by relation widgets above)
  # ---------------------------------------------------------------------------
  # Tags defined here become available in the Tags picker for Blog Posts and
  # Portfolio Projects. To add a new approved tag: create a new entry here,
  # then it will appear in the Tags relation field on content editors.
  # Fields: title (stored in frontmatter), category, description.
  # ---------------------------------------------------------------------------
  - name: 'tags_registry'
    label: 'Tag Registry'
    label_singular: 'Tag'
    folder: 'data/tags'
    create: true
    identifier_field: 'title'
    extension: 'yaml'
    format: 'yaml'
    slug: '{{slug}}'
    summary: '{{title}} ({{category}})'
    sortable_fields: ['title', 'category']
    view_groups:
      - label: 'By Category'
        field: category
    fields:
      - {
          label: 'Tag Name',
          name: 'title',
          widget: 'string',
          hint: 'Display name shown in CMS pickers and on tag pages (e.g. "Design Systems").'
        }
      - label: 'Category'
        name: 'category'
        widget: 'select'
        options:
          - { label: '🎨 Design', value: 'design' }
          - { label: '🧪 UX', value: 'ux' }
          - { label: '⚙️ Engineering', value: 'engineering' }
          - { label: '🛠 Tools', value: 'tools' }
          - { label: '📋 Process', value: 'process' }
        hint: 'Used to group tags on the /tags/ index page.'
      - {
          label: 'Description',
          name: 'description',
          widget: 'text',
          hint: 'One sentence shown on the tag landing page. Describe the topic scope.'
        }

  # ---------------------------------------------------------------------------
  # SITE SETTINGS  ← appearance & availability controls
  # ---------------------------------------------------------------------------
  - name: 'settings'
    label: 'Site Settings'
    files:
      - label: 'Availability'
        name: 'availability'
        file: 'data/settings.yaml'
        fields:
          - label: 'Availability Mode'
            name: 'availability_mode'
            widget: 'select'
            hint: 'Controls the coloured ring and status dot in the site header'
            options:
              - { label: '🕐 Auto — follow business hours (Mon–Fri 9 AM–6 PM CT)', value: 'auto' }
              - { label: '🟢 Available — force gradient ring on', value: 'available' }
              - { label: '⚫ Away — force grey ring off', value: 'away' }
            default: 'auto'
          - label: 'Ring Color Override'
            name: 'ring_color'
            widget: 'select'
            hint: 'Leave blank to use automatic page-type colours (recommended). Set only to lock a single colour site-wide — this overrides the per-page mapping.'
            options:
              - { label: '⬜ Auto — use page-type colour map (recommended)', value: '' }
              - { label: '🌈 Gradient (amber/red/purple/blue)', value: 'gradient' }
              - { label: '🔵 Blue', value: 'blue' }
              - { label: '🟢 Green', value: 'green' }
              - { label: '🟣 Purple', value: 'purple' }
              - { label: '🟠 Orange', value: 'orange' }
              - { label: '🩷 Pink', value: 'pink' }
              - { label: '🩵 Teal', value: 'teal' }
              - { label: '🟡 Gold', value: 'gold' }
            default: ''
          - label: 'Custom Away Message'
            name: 'away_message'
            widget: 'string'
            required: false
            hint: 'Optional — overrides the default next-open text in the stories panel. Leave blank to use automatic text.'
          - label: 'Available Label'
            name: 'available_label'
            widget: 'string'
            default: 'Available for new projects'
            required: false
            hint: 'Text shown in the status pill on the About page when available. Also reflected in the header ring state.'
          - label: 'Away Label'
            name: 'away_label'
            widget: 'string'
            default: 'Heads down on a project'
            required: false
            hint: "Text shown in the status pill on the About page when availability_mode is 'away'. Pill colour also switches to amber."

  # ---------------------------------------------------------------------------
  # SITE PAGES
  # ---------------------------------------------------------------------------
  - name: 'pages'
    label: 'Site Pages'
    files:
      - label: 'Blog Index'
        name: 'blog_index'
        file: 'content/posts/_index.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Date', name: 'date', widget: 'datetime' }
          - { label: 'Description', name: 'description', widget: 'text' }
          - { label: 'Body', name: 'body', widget: 'markdown', required: false }

      - label: 'Homepage'
        name: 'homepage'
        file: 'content/_index.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Date', name: 'date', widget: 'datetime' }
          - { label: 'Description', name: 'description', widget: 'text' }
          - { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false }
          - { label: 'Body', name: 'body', widget: 'markdown' }

      - label: 'About'
        name: 'about'
        file: 'content/about.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Date', name: 'date', widget: 'datetime' }
          - { label: 'Description', name: 'description', widget: 'text', hint: 'Meta description — shown in search results and social previews.' }
          - { label: 'Page Heading', name: 'heading', widget: 'string', hint: 'Large hero headline. Keep to ~60 chars.' }
          - { label: 'Tagline', name: 'tagline', widget: 'string', hint: 'Eyebrow line shown above the heading. e.g. Frontend Developer · Chicago, IL' }
          - label: 'Stats'
            name: 'stats'
            widget: 'list'
            label_singular: 'Stat'
            summary: '{{fields.value}} — {{fields.label}}'
            hint: 'Key metrics shown in the hero strip. 3 recommended.'
            fields:
              - { label: 'Value', name: 'value', widget: 'string', hint: 'e.g. 5+ or 72%' }
              - { label: 'Label', name: 'label', widget: 'string', hint: 'e.g. Years of frontend engineering' }
          - { label: 'Body', name: 'body', widget: 'markdown' }

      - label: 'Contact'
        name: 'contact'
        file: 'content/contact.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Date', name: 'date', widget: 'datetime' }
          - { label: 'Description', name: 'description', widget: 'text' }
          - { label: 'Body', name: 'body', widget: 'markdown' }

      - label: 'Links Page'
        name: 'links'
        file: 'content/links.md'
        fields:
          - { label: 'Title (handle)', name: 'title', widget: 'string', hint: 'Displayed as the page @handle. e.g. @isaiahdaviscom' }
          - { label: 'Description', name: 'description', widget: 'text', hint: 'Meta description for search engines and social previews.' }
          - { label: 'Avatar', name: 'avatar', widget: 'image', required: false, hint: 'Profile picture. Defaults to /images/profile-branded.png if not set.' }
          - { label: 'Tagline', name: 'tagline', widget: 'string', hint: 'One-line descriptor shown under the handle. e.g. Frontend Developer · UI Engineer' }
          - { label: 'Location', name: 'location', widget: 'string', required: false, hint: 'e.g. Chicago, IL' }
          - label: 'Stats'
            name: 'stats'
            widget: 'list'
            label_singular: 'Stat'
            summary: '{{fields.value}} — {{fields.label}}'
            hint: 'Key metrics shown below the profile. 3 recommended.'
            fields:
              - { label: 'Value', name: 'value', widget: 'string', hint: 'e.g. 5+ or 72%' }
              - { label: 'Label', name: 'label', widget: 'string', hint: 'e.g. Years exp.' }
          - label: 'Social Links'
            name: 'social'
            widget: 'list'
            label_singular: 'Link'
            summary: '{{fields.name}} — {{fields.url}}'
            fields:
              - { label: 'Name', name: 'name', widget: 'string' }
              - { label: 'URL', name: 'url', widget: 'string' }
              - { label: 'Icon', name: 'icon', widget: 'select', options: ['linkedin', 'github', 'email', 'portfolio', 'blog'], hint: 'Maps to an inline SVG icon.' }
              - { label: 'Label (accessibility)', name: 'label', widget: 'string', hint: 'Screen reader text. e.g. Connect on LinkedIn' }
          - label: 'Services'
            name: 'services'
            widget: 'list'
            label_singular: 'Service'
            hint: 'Chip labels shown in the horizontal scroll row.'
            field: { label: 'Service', name: 'item', widget: 'string' }

      - label: 'Portfolio Index'
        name: 'portfolio_index'
        file: 'content/portfolio.md'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Date', name: 'date', widget: 'datetime' }
          - { label: 'Description', name: 'description', widget: 'text' }
          - { label: 'Body', name: 'body', widget: 'markdown' }

# =============================================================================
# ADDITIONAL CMS SETTINGS
# =============================================================================

# Logo for the CMS interface
logo_url: https://isaiahdavis.com/images/logo.png

# Custom preview styles (optional)
# editor:
#   preview: false

# Show preview links
show_preview_links: true

# Slug configuration
slug:
  encoding: 'unicode'
  clean_accents: true
  sanitize_replacement: '-'
# =============================================================================
# ENVIRONMENT-SPECIFIC NOTES
# =============================================================================
#
# PRODUCTION SETUP (Netlify):
# 1. Enable Identity in Netlify dashboard
# 2. Enable Git Gateway in Identity settings
# 3. Set registration to "Invite only" for security
# 4. Access CMS at: https://isaiahdavis.com/admin/
#
# DEVELOPMENT SETUP (Local) — no config changes needed:
# 1. Terminal 1: hugo server -D --config hugo.toml,config.development.toml
# 2. Terminal 2: npm run cms:local
# 3. Access CMS at: http://localhost:1313/admin/
#    (local_backend: true handles the proxy switch automatically)
#
# CONTENT WORKFLOW:
# 1. Create/edit content in CMS (Blog Posts is the default landing screen)
# 2. New posts saved as drafts by default (draft: true)
# 3. Change draft → false to publish
# 4. Changes deploy automatically via Netlify Git integration
#    Or manually: npm run migrate:deploy
#
# =============================================================================
