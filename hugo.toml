baseURL = 'https://isaiahdavis.com'
languageCode = 'en-us'
title = 'Isaiah Davis - My Portfolio'
theme = 'myPortfolio'

[params]
  author = "Isaiah Davis"
  description = "My portfolio website"
  storybookBaseURL = ""
  keywords = ["portfolio", "web developer", "Isaiah Davis"]
  logo = "images/logo.png"
  favicon = "images/favicon.ico"
  theme = "system"
  themeColor = "#4a90e2"
  title = "Isaiah Davis - My Portfolio"
  version = "1.0.0"
  # Google Tag Manager container ID — override per environment in config.*.toml
  gtmId = "GTM-W3VQVDR"
  

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[build]

# Sitemap configuration (disabled for development)
[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[deploy]
  [[deploy.targets]]
    name = "Netlify"
    URL = "https://api.netlify.com/build_hooks/your-build-hook-url"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[[menus.main]]
# myportfolio\themes\myPortfolio\layouts\_default\home.html
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Portfolio'
pageRef = '/portfolio'
weight = 15

[[menus.main]]
name = 'Blog'
pageRef = '/posts'
weight = 20

[[menus.main]]
name = 'About'
pageRef = '/about'
weight = 30

[[menus.main]]
name = 'Contact'
pageRef = '/contact'
weight = 40
