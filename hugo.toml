baseURL = 'https://isaiahdavis.com'
languageCode = 'en-us'
title = 'Isaiah Davis - My Portfolio'
theme = 'myPortfolio'

[params]
  author = "Isaiah Davis"
  description = "Isaiah Davis is a Chicago-based Frontend Developer and UI Engineer building fast, accessible, design-system-driven websites. Available for freelance, contract and full-time work, remote-friendly."
  homeTitle = "Isaiah Davis | Frontend Developer & UI Engineer in Chicago"
  storybookBaseURL = ""
  keywords = ["Isaiah Davis", "frontend developer", "UI engineer", "Chicago", "design systems", "web accessibility", "web performance", "freelance web developer", "portfolio"]
  logo = "images/logo.png"
  favicon = "images/favicon.ico"
  theme = "system"
  themeColor = "#4a90e2"
  title = "Isaiah Davis - My Portfolio"
  version = "1.2.0"
  # Google Tag Manager container ID — override per environment in config.*.toml
  gtmId = "GTM-W3VQVDR"
  

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFull"]

# /llms.txt (curated index) and /llms-full.txt (full context) for LLM-based answer engines.
[outputFormats.LLMS]
  mediaType      = "text/plain"
  baseName       = "llms"
  isPlainText    = true
  notAlternative = true

[outputFormats.LLMSFull]
  mediaType      = "text/plain"
  baseName       = "llms-full"
  isPlainText    = true
  notAlternative = true

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[build]

# =============================================================================
# VERSION BADGE — custom SVG output format
# Generates /badges/version.svg at build time from site.Params.version.
# Used by README.md and the site footer. Single source of truth: hugo.toml.
# =============================================================================
[outputFormats.SVG]
  mediaType      = "image/svg+xml"
  baseName       = "version"
  isPlainText    = true
  notAlternative = true

# Sitemap configuration (disabled for development)
[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[deploy]
  [[deploy.targets]]
    name = "Netlify"
    URL = "https://api.netlify.com/build_hooks/your-build-hook-url"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    codeFences  = true    # process fenced code blocks
    guessSyntax = true    # auto-detect language when not specified
    noClasses   = false   # use CSS classes (chroma.css) instead of inline styles

[[menus.main]]
# myportfolio\themes\myPortfolio\layouts\_default\home.html
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Portfolio'
pageRef = '/portfolio'
weight = 15

[[menus.main]]
name = 'Blog'
pageRef = '/posts'
weight = 20

[[menus.main]]
name = 'About'
pageRef = '/about'
weight = 30

[[menus.main]]
name = 'Contact'
pageRef = '/contact'
weight = 40
