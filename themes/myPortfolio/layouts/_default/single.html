{{ define "main" }}
<section class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-gray-100 py-12">
  <div class="container mx-auto px-4">
    <article class="prose prose-lg max-w-3xl mx-auto text-gray-800 bg-white rounded-xl shadow-lg p-8 border border-blue-100">
      <h1 class="text-4xl font-extrabold mb-6 tracking-tight">{{ .Title }}</h1>
      {{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
      {{ $dateHuman := .Date | time.Format ":date_long" }}
      <time datetime="{{ $dateMachine }}" class="block text-gray-500 text-xs mb-4">{{ $dateHuman }}</time>
      {{ .Content }}
      {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
    </article>
  </div>
</section>
{{ end }}
