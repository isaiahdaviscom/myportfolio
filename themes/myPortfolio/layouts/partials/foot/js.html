<script>
  ((i, e) => {
    // <stdin>
    const init = () => {
      const currentYear = new Date().getFullYear();
      const footerYear = document.getElementById('footer-year');
      if (footerYear) {
        footerYear.textContent = currentYear;
      }
      const footerVersion = document.getElementById('footer-version');
      if (footerVersion) {
        footerVersion.textContent = 'v1.0.0'; // Replace with actual version if available
      }

      // ── Cookie consent + analytics gating ───────────────────────────────
      const CONSENT_KEY = 'site-cookie-consent-v1';
      const CONSENT_DISMISS_KEY = 'site-cookie-consent-dismissed-v1';

      const cookieBanner = document.querySelector('[data-cookie-banner]');
      const cookiePanel = document.querySelector('[data-cookie-panel]');
      const cookieFab = document.querySelector('.cookie-settings-fab');
      const analyticsField = document.querySelector('[data-consent-field="analytics"]');
      const statusField = document.querySelector('[data-consent-status]');

      let focusRestoreEl = null;
      let focusTrapBound = false;
      let consentState = null;

      let gtmLoaded = false;

      const readConsent = () => {
        if (consentState && typeof consentState.analytics === 'boolean') {
          return consentState;
        }

        try {
          const raw = localStorage.getItem(CONSENT_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed.analytics !== 'boolean') return null;
          consentState = parsed;
          return parsed;
        } catch (_) {
          return null;
        }
      };

      const writeConsent = (analyticsEnabled) => {
        const consent = {
          essential: true,
          analytics: Boolean(analyticsEnabled),
          timestamp: new Date().toISOString(),
        };

        consentState = consent;

        try {
          localStorage.setItem(CONSENT_KEY, JSON.stringify(consent));
        } catch (_) {}

        return consent;
      };

      const hasDecision = (consent) => {
        return Boolean(consent && typeof consent.analytics === 'boolean');
      };

      const isDismissed = () => {
        try {
          return sessionStorage.getItem(CONSENT_DISMISS_KEY) === '1';
        } catch (_) {
          return false;
        }
      };

      const setDismissed = (value) => {
        try {
          if (value) sessionStorage.setItem(CONSENT_DISMISS_KEY, '1');
          else sessionStorage.removeItem(CONSENT_DISMISS_KEY);
        } catch (_) {}
      };

      const announceStatus = (message) => {
        if (!statusField) return;
        statusField.textContent = message || '';
      };

      const getPanelFocusable = () => {
        if (!cookiePanel) return [];
        return Array.from(
          cookiePanel.querySelectorAll(
            'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
          )
        );
      };

      const trapPanelFocus = (ev) => {
        if (!cookiePanel || cookiePanel.hidden || ev.key !== 'Tab') return;
        const focusable = getPanelFocusable();
        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        const active = document.activeElement;

        if (ev.shiftKey && active === first) {
          ev.preventDefault();
          last.focus();
          return;
        }

        if (!ev.shiftKey && active === last) {
          ev.preventDefault();
          first.focus();
        }
      };

      const setPanelOpen = (open) => {
        if (!cookiePanel) return;

        if (open && !focusRestoreEl) {
          focusRestoreEl = document.activeElement;
        }

        cookiePanel.hidden = !open;
        cookiePanel.style.display = open ? 'grid' : 'none';
        cookiePanel.setAttribute('aria-hidden', String(!open));
        document.body.classList.toggle('cookie-panel-open', open);

        if (cookieFab) {
          cookieFab.setAttribute('aria-expanded', String(open));
        }

        if (open) {
          const focusable = getPanelFocusable();
          if (focusable.length) {
            focusable[0].focus();
          }

          if (!focusTrapBound) {
            document.addEventListener('keydown', trapPanelFocus);
            focusTrapBound = true;
          }
        } else {
          if (focusTrapBound) {
            document.removeEventListener('keydown', trapPanelFocus);
            focusTrapBound = false;
          }

          if (focusRestoreEl && typeof focusRestoreEl.focus === 'function') {
            focusRestoreEl.focus();
          }
          focusRestoreEl = null;
        }
      };

      const setBannerVisible = (visible) => {
        if (!cookieBanner) return;
        cookieBanner.hidden = !visible;
        cookieBanner.style.display = visible ? '' : 'none';
      };

      const setSettingsVisible = (visible) => {
        if (!cookieFab) return;
        cookieFab.hidden = !visible;
      };

      const applyConsentMode = (consent, mode) => {
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function gtag() {
          window.dataLayer.push(arguments);
        };

        const granted = Boolean(consent && consent.analytics);
        window.gtag('consent', mode || 'default', {
          ad_storage: granted ? 'granted' : 'denied',
          ad_user_data: granted ? 'granted' : 'denied',
          ad_personalization: granted ? 'granted' : 'denied',
          analytics_storage: granted ? 'granted' : 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted',
        });
      };

      const loadGtmIfAllowed = (consent) => {
        if (!consent || !consent.analytics || gtmLoaded) return;
        const cfg = window.__SITE_GTM__;
        if (!cfg || !cfg.id) return;

        const existing = document.querySelector('script[src*="googletagmanager.com/gtm.js?id="]');
        if (existing) {
          gtmLoaded = true;
          return;
        }

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });

        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtm.js?id=' + encodeURIComponent(cfg.id) + (cfg.env || '');
        document.head.appendChild(script);
        gtmLoaded = true;
      };

      const syncConsentUI = (consent) => {
        if (analyticsField) {
          analyticsField.checked = Boolean(consent && consent.analytics);
        }

        const decided = hasDecision(consent);
        const dismissed = !decided && isDismissed();

        setBannerVisible(!decided && !dismissed);
        setSettingsVisible(decided || dismissed);
      };

      const commitConsent = (analyticsEnabled, source) => {
        const consent = writeConsent(analyticsEnabled);
        setDismissed(false);
        applyConsentMode(consent, 'update');
        loadGtmIfAllowed(consent);
        syncConsentUI(consent);
        setPanelOpen(false);

        if (source === 'accept') {
          announceStatus('Preferences saved: analytics enabled.');
        } else if (source === 'reject') {
          announceStatus('Preferences saved: analytics disabled.');
        } else {
          announceStatus('Preferences saved.');
        }
      };

      const consent = readConsent();
      applyConsentMode(consent, 'default');
      loadGtmIfAllowed(consent);
      syncConsentUI(consent);

      e.addEventListener('click', (ev) => {
        const trigger = ev.target.closest('[data-consent-action]');
        if (!trigger) return;

        const action = trigger.getAttribute('data-consent-action');

        if (action === 'accept') {
          commitConsent(true, 'accept');
          return;
        }

        if (action === 'reject') {
          commitConsent(false, 'reject');
          return;
        }

        if (action === 'open-settings') {
          setDismissed(false);
          const latestConsent = readConsent();
          if (analyticsField) {
            analyticsField.checked = Boolean(latestConsent && latestConsent.analytics);
          }
          setPanelOpen(true);
          return;
        }

        if (action === 'dismiss') {
          setDismissed(true);
          syncConsentUI(readConsent());
          announceStatus('Cookie banner dismissed for now.');
          return;
        }

        if (action === 'save-settings') {
          commitConsent(Boolean(analyticsField && analyticsField.checked), 'save');
          return;
        }

        if (action === 'close-settings') {
          setPanelOpen(false);
        }
      });

      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && cookiePanel && !cookiePanel.hidden) {
          setPanelOpen(false);
        }
      });
      // ── End cookie consent + analytics gating ───────────────────────────

      // Shared page-state classes used by connected sticky UI (header + jumplinks)
      document.body.classList.toggle('has-jumplinks', Boolean(document.querySelector('.jumplinks')));

      // ── Mobile navigation drawer ─────────────────────────────────────────
      const navToggle  = document.getElementById('nav-toggle');
      const siteHeader = document.querySelector('.site-header');
      const mobileNav  = document.getElementById('mobile-nav');

      if (navToggle && siteHeader && mobileNav) {
        // Toggle drawer open/closed
        navToggle.addEventListener('click', () => {
          const isOpen = siteHeader.classList.toggle('nav-open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
          navToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
          mobileNav.setAttribute('aria-hidden', String(!isOpen));
        });

        // Close on Escape key
        document.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape' && siteHeader.classList.contains('nav-open')) {
            siteHeader.classList.remove('nav-open');
            navToggle.setAttribute('aria-expanded', 'false');
            navToggle.setAttribute('aria-label', 'Open navigation menu');
            mobileNav.setAttribute('aria-hidden', 'true');
            navToggle.focus();
          }
        });

        // Close when a drawer nav link is clicked (navigating away)
        mobileNav.querySelectorAll('a').forEach((link) => {
          link.addEventListener('click', () => {
            siteHeader.classList.remove('nav-open');
            navToggle.setAttribute('aria-expanded', 'false');
            navToggle.setAttribute('aria-label', 'Open navigation menu');
            mobileNav.setAttribute('aria-hidden', 'true');
          });
        });

        // Close when viewport widens past the mobile breakpoint
        const mq = window.matchMedia('(min-width: 768px)');
        mq.addEventListener('change', (ev) => {
          if (ev.matches && siteHeader.classList.contains('nav-open')) {
            siteHeader.classList.remove('nav-open');
            navToggle.setAttribute('aria-expanded', 'false');
            navToggle.setAttribute('aria-label', 'Open navigation menu');
            mobileNav.setAttribute('aria-hidden', 'true');
          }
        });
      }
      // ── End mobile navigation ────────────────────────────────────────────

      // ── Header scroll elevation ──────────────────────────────────────────
      // Adds .site-header--scrolled once the user scrolls past the top,
      // deepening the glass blur and shadow for better page separation.
      const header = document.querySelector('.site-header');
      if (header) {
        const onScroll = () => {
          const isScrolled = window.scrollY > 4;
          header.classList.toggle('site-header--scrolled', isScrolled);
          document.body.classList.toggle('header-is-scrolled', isScrolled);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll(); // initialise on load (e.g. browser restores scroll position)
      }
      // ── End header scroll elevation ──────────────────────────────────────

      // ── Smooth anchor scroll ─────────────────────────────────────────────
      // Handles internal anchor links: scrolls to the target, offset by
      // the sticky header height, and updates the URL hash without a jump.
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener('click', (ev) => {
          const id = anchor.getAttribute('href').slice(1);
          if (!id) return;
          const target = document.getElementById(id);
          if (!target) return;
          ev.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // Update URL hash without triggering a native jump
          history.pushState(null, '', '#' + id);
          // Move focus to the target for keyboard users
          if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
          target.focus({ preventScroll: true });
        });
      });
      // ── End smooth anchor scroll ─────────────────────────────────────────

      // ── Jumplink active state ───────────────────────────────────────────
      // Keeps the current section pill highlighted as the reader scrolls.
      document.querySelectorAll('.jumplinks').forEach((nav) => {
        const list = nav.querySelector('.jumplinks__list');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const items = Array.from(nav.querySelectorAll('.jumplinks__link[href^="#"]'))
          .map((link) => {
            const id = link.getAttribute('href').slice(1);
            const target = id ? document.getElementById(id) : null;
            return target ? { link, target } : null;
          })
          .filter(Boolean);

        if (!items.length) return;

        let activeId = null;

        const syncOverflow = () => {
          if (!list) return;

          const overflowThreshold = 12;
          const maxScrollLeft = Math.max(list.scrollWidth - list.clientWidth, 0);
          const hasOverflow = maxScrollLeft > overflowThreshold;
          const showStart = hasOverflow && list.scrollLeft > overflowThreshold;
          const showEnd = hasOverflow && list.scrollLeft < maxScrollLeft - overflowThreshold;

          nav.classList.toggle('is-overflowing-start', showStart);
          nav.classList.toggle('is-overflowing-end', showEnd);
        };

        const keepActiveInView = (link, behavior = 'auto') => {
          if (!list || !link) return;

          const listRect = list.getBoundingClientRect();
          const linkRect = link.getBoundingClientRect();
          const overflowThreshold = 12;
          const clippedStart = linkRect.left < listRect.left + overflowThreshold;
          const clippedEnd = linkRect.right > listRect.right - overflowThreshold;

          if (clippedStart || clippedEnd) {
            link.scrollIntoView({
              block: 'nearest',
              inline: 'nearest',
              behavior,
            });

            window.requestAnimationFrame(syncOverflow);
          }
        };

        const setActive = (id, { scrollIntoView = false, behavior = 'auto' } = {}) => {
          let activeLink = null;

          items.forEach(({ link, target }) => {
            const isActive = target.id === id;
            link.classList.toggle('is-active', isActive);
            if (isActive) link.setAttribute('aria-current', 'location');
            else link.removeAttribute('aria-current');
            if (isActive) activeLink = link;
          });

          if (scrollIntoView && activeId !== id) {
            keepActiveInView(activeLink, behavior);
          }

          activeId = id;
        };

        const syncActive = () => {
          const headerOffset = header ? header.offsetHeight : 0;
          const navOffset = nav.offsetHeight || 0;
          const threshold = headerOffset + navOffset + 24;
          let current = items[0].target.id;

          items.forEach(({ target }) => {
            if (target.getBoundingClientRect().top - threshold <= 0) {
              current = target.id;
            }
          });

          setActive(current, { scrollIntoView: true });
        };

        let ticking = false;
        const queueSync = () => {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(() => {
            syncActive();
            syncOverflow();
            ticking = false;
          });
        };

        if (window.location.hash) {
          const hashId = window.location.hash.slice(1);
          const hashMatch = items.find(({ target }) => target.id === hashId);
          if (hashMatch) setActive(hashMatch.target.id, { scrollIntoView: true });
        }

        items.forEach(({ link, target }) => {
          link.addEventListener('click', () => {
            setActive(target.id, {
              scrollIntoView: true,
              behavior: prefersReducedMotion ? 'auto' : 'smooth',
            });
          });
        });

        window.addEventListener('scroll', queueSync, { passive: true });
        window.addEventListener('resize', queueSync, { passive: true });
        window.addEventListener('hashchange', queueSync);
        list?.addEventListener('scroll', syncOverflow, { passive: true });
        queueSync();
      });
      // ── End jumplink active state ───────────────────────────────────────

      // ── Section / card reveal (IntersectionObserver) ─────────────────────
      // Targets cards and key content blocks. Skips elements already in the
      // viewport on load (above-the-fold hero content). Respects
      // prefers-reduced-motion — the CSS transitions are already disabled
      // via the token system so we still add .is-visible for layout parity.
      const REVEAL_SELECTORS = [
        '.home-work-card',
        '.home-post-card',
        '.home-about__bio',
        '.home-about__services',
        '.pf-card',
        '.pf-split',
        '.blog-card',
        '.page-card',
        '.contact-split > *',
        '.about-bio .container > *',
        '.about-skills .container > *',
        '.about-values .container > *',
      ].join(', ');

      const revealTargets = document.querySelectorAll(REVEAL_SELECTORS);
      if (revealTargets.length && 'IntersectionObserver' in window) {
        const revealObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                revealObserver.unobserve(entry.target); // trigger once
              }
            });
          },
          { threshold: 0.07, rootMargin: '0px 0px -32px 0px' }
        );

        // Group siblings in the same parent so we can stagger them
        const groups = new Map();
        revealTargets.forEach((el) => {
          const key = el.parentElement;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(el);
        });
        groups.forEach((siblings) => {
          siblings.forEach((el, i) => {
            el.setAttribute('data-reveal', '');
            el.style.setProperty('--reveal-order', i); // drives CSS stagger delay
            revealObserver.observe(el);
          });
        });
      }
      // ── End reveal ───────────────────────────────────────────────────────
    };

    if (e.readyState === 'loading') {
      e.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  })(window, document);
</script>
