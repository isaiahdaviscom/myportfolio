# Hugo configuration for development environment
# This file overrides hugo.toml settings for development builds

baseURL = "https://myportfolio-develop.netlify.app"

# Disable features for development
disableKinds = ["sitemap", "robotsTXT", "RSS"]

# Enable development features
buildDrafts = true
buildFuture = true
buildExpired = true

# SEO protection for development
[params]
  noindex = true
  environment = "development"
  # GTM — dev/staging environment
  # Get these values from: GTM → Admin → Environments → (your dev env) → Actions → Get snippet
  gtmId      = "GTM-W3VQVDR"
  gtmAuth    = "6UN9jq3VJFKVhPybI-zE2g"
  gtmPreview = "26"   # e.g. "env-2"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true