# Sitemap preview override
# Loaded on top of config.development.toml to re-enable sitemap output only.
# Usage (via CLI): pf sitemap
# Usage (manual):  hugo server -D --config hugo.toml,config.development.toml,config.sitemap-preview.toml
#
# config.development.toml disables sitemap/RSS/robotsTXT entirely.
# This file overrides that list to exclude only RSS and robotsTXT, leaving
# sitemap enabled so it is generated and accessible at /sitemap.xml.
disableKinds = ["robotsTXT", "RSS"]
