[build]
  command = "npm run build:all"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.132.2"
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Development/Staging environment (develop branch)
[context.develop]
  command = "npm run build:all"
  [context.develop.environment]
    HUGO_ENV = "development"
    HUGO_BASEURL = "https://develop--myportfolio-staging.netlify.app"

# Production environment (master branch)
[context.production]
  command = "npm run build:all"
  [context.production.environment]
    HUGO_ENV = "production"
    HUGO_BASEURL = "https://isaiahdavis.com"

# Deploy previews (for pull requests)
[context.deploy-preview]
  command = "npm run build:all"
  [context.deploy-preview.environment]
    HUGO_ENV = "preview"

# Branch deploys (any other branch)
[context.branch-deploy]
  command = "npm run build:all"
  [context.branch-deploy.environment]
    HUGO_ENV = "staging"

[build.processing]
  skip_processing = ["node_modules/**"]

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Handle SPA fallback for any other routes that don't exist
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"